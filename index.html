<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Braccio-Simulator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css" />
  </head>
  <body>
    <header class="topbar" id="topbar"></header>
    <main class="layout">
      <section class="stage">
        <div id="viewport">
          <div class="hud" id="hud"></div>
          <div class="hud-right" id="hudRight"></div>
          <div class="help-hint">Linke Maustaste: drehen · Rechte: verschieben · Mausrad: zoomen · Klick auf Würfel: auswählen</div>
        </div>
        <div class="scope" id="scope"></div>
      </section>
      <aside class="side">
        <nav class="tabs" id="tabs"></nav>
        <div class="tabpanes" id="panes"></div>
      </aside>
    </main>
    <div id="toast" class="toast"></div>

    <!-- Bibliotheken (Internetverbindung erforderlich) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>

    <!-- Simulator -->
    <script src="js/core.js"></script>
    <script src="js/kinematics.js"></script>
    <script src="js/trajectory.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/arduino.js"></script>
    <script src="js/view3d.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ui-joints.js"></script>
    <script src="js/ui-code.js"></script>
    <script src="js/ui-traj.js"></script>
    <script src="js/ui-ik.js"></script>
    <script src="js/ui-calib.js"></script>
    <script src="js/ui-workspace.js"></script>
    <script src="js/ui-pnp.js"></script>
    <script src="js/ui-model.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
